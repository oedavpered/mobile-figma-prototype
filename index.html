<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <meta name="description" content="Введите код со стикера и заберите приз">
  <title>Ценный приз</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='54' font-size='56'%3E🔥%3C/text%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--orange:#f47800;--purple:#310568}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:#050607;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#262626}
    .scene{position:relative;isolation:isolate;width:100%;height:100%;min-height:560px;background:radial-gradient(circle at 50% 52%,#141719 0 8%,#090a0b 38%,#030405 100%)}
    #sparks{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
    .spark{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:var(--s);height:var(--s);font-size:var(--s);line-height:1;filter:drop-shadow(0 0 7px rgba(255,96,0,.58));will-change:transform,opacity;animation:burst var(--d) cubic-bezier(.22,.58,.32,1) var(--delay) forwards}
    @keyframes burst{0%{transform:translate(-50%,-50%) scale(.24) rotate(0);opacity:0}11%{opacity:1}86%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(var(--scale)) rotate(var(--rot));opacity:0}}
    .card{position:absolute;z-index:2;left:clamp(16px,4vw,32px);right:clamp(16px,4vw,32px);top:50%;transform:translateY(-50%);margin:auto;max-width:720px;border-radius:31px;background:#fff;padding:45px 32px 30px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.46)}
    .celebration{position:relative;width:184px;height:154px;margin:-15px auto 12px}
    .star{position:absolute;left:36px;top:13px;width:118px;height:118px;background:linear-gradient(35deg,#ffa900 0 52%,#ffbc00 52%);clip-path:polygon(50% 0,62% 35%,100% 38%,71% 60%,80% 100%,50% 77%,18% 100%,27% 60%,0 38%,38% 35%);transform:rotate(-7deg)}
    .confetti{position:absolute;color:#ef7100;font-weight:900;font-size:25px;line-height:1}.c1{left:7px;top:19px;transform:rotate(-30deg)}.c2{right:1px;top:91px;transform:rotate(43deg)}.c3{left:28px;bottom:2px;font-size:16px}.c4{right:33px;top:8px;font-size:20px}.c5{left:64px;top:0;font-size:15px}.c6{right:35px;bottom:2px;font-size:16px}
    h1{margin:0;color:var(--purple);font-size:clamp(33px,5.7vw,46px);line-height:1.2;font-weight:780;letter-spacing:-1.2px}
    .description{max-width:620px;margin:20px auto 31px;font-size:clamp(21px,4vw,31px);line-height:1.28;font-weight:400}
    form{display:grid;gap:31px}
    input{width:100%;height:104px;border:2px solid transparent;border-radius:36px;background:#f7f7f7;padding:0 31px;color:#252525;font:400 clamp(22px,4.1vw,31px)/1 inherit;outline:none;transition:border-color .2s,box-shadow .2s}
    input::placeholder{color:#b9b9b9}
    input:focus{border-color:#ff9a3c;box-shadow:0 0 0 4px rgba(244,120,0,.12)}
    button{height:97px;border:0;border-radius:48px;background:var(--orange);color:white;font:400 clamp(22px,4.1vw,31px)/1 inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,filter .2s}
    button:active{transform:scale(.985);filter:brightness(.94)}
    .message{display:none;margin:-13px 0 0;color:var(--purple);font-size:17px}
    .message.show{display:block}
    @media(max-width:480px){
      .scene{min-height:520px}
      .card{left:16px;right:16px;max-width:358px;border-radius:16px;padding:24px 16px 15px}
      .celebration{width:110px;height:112px;margin:0 auto 7px}
      .star{left:10px;top:4px;width:90px;height:90px}
      .confetti{font-size:15px}.c1{left:-2px;top:13px}.c2{right:-2px;top:66px}.c3{left:14px;bottom:1px;font-size:11px}.c4{right:11px;top:3px;font-size:14px}.c5{left:38px;top:-3px;font-size:11px}.c6{right:15px;bottom:1px;font-size:11px}
      h1{font-size:24px;line-height:1.17;letter-spacing:-.55px}
      .description{width:calc(100% + 16px);margin:8px -8px 15px;font-size:15.5px;line-height:1.25;letter-spacing:-.18px}
      form{gap:16px}
      input{height:52px;border-radius:19px;padding:0 16px;font-size:16px}
      button{height:49px;border-radius:25px;font-size:16px}
      .message{margin:-8px 0 -4px;font-size:14px}
    }
    @media(max-height:640px) and (max-width:480px){.card{transform:translateY(-50%) scale(.88)}}
    @media(prefers-reduced-motion:reduce){.spark{animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="scene">
    <div id="sparks" aria-hidden="true"></div>
    <section class="card" aria-labelledby="title">
      <div class="celebration" aria-hidden="true">
        <div class="star"></div><i class="confetti c1">⌁</i><i class="confetti c2">⌁</i><i class="confetti c3">◆</i><i class="confetti c4">★</i><i class="confetti c5">✦</i><i class="confetti c6">◀</i>
      </div>
      <h1 id="title">Вы выиграли ценный<br>приз!!!</h1>
      <p class="description">Введите уникальный цифровой код,<br>расположенный под промокодом на стикере<br>и получите ценный приз!</p>
      <form id="claim" novalidate>
        <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="one-time-code" aria-label="Уникальный цифровой код" placeholder="Например: 234765890">
        <p class="message" id="message" role="status"></p>
        <button type="submit">Забрать приз</button>
      </form>
    </section>
  </main>
  <script>
    const field=document.querySelector('#code'),form=document.querySelector('#claim'),message=document.querySelector('#message'),layer=document.querySelector('#sparks');
    field.addEventListener('input',()=>{field.value=field.value.replace(/\D/g,'');message.classList.remove('show')});
    form.addEventListener('submit',e=>{e.preventDefault();message.textContent=field.value.length<6?'Введите цифровой код со стикера':'Код принят — ваш приз уже совсем близко!';message.classList.add('show');if(field.value.length>=6)burst(22)});
    function makeSpark(extra=false){const el=document.createElement('span');const angle=Math.random()*Math.PI*2;const radius=(Math.max(innerWidth,innerHeight)*(.34+Math.random()*.55));const size=(extra?34:28)+Math.random()*(extra?62:52);const duration=3.7+(size/96)*1.35+Math.random()*1.05;el.className='spark';el.textContent='🔥';el.style.cssText=`--x:${Math.cos(angle)*radius}px;--y:${Math.sin(angle)*radius}px;--s:${size}px;--d:${duration}s;--delay:${Math.random()*.55}s;--rot:${-38+Math.random()*76}deg;--scale:${.72+Math.random()*.68}`;layer.append(el);setTimeout(()=>el.remove(),7200)}
    function burst(count=7){for(let i=0;i<count;i++)setTimeout(()=>makeSpark(count>10),i*38)}
    burst(18);setInterval(()=>burst(5+Math.floor(Math.random()*5)),1450);
  </script>
</body>
</html>
